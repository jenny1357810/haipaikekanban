<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>海拍客看板</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Hipac Monitoring Board</p>
          <h1>海拍客看板</h1>
        </div>
        <div class="header-actions">
          <label class="upload-button" for="file-upload">导入周报</label>
          <input id="file-upload" type="file" accept=".xlsx,.xls,.csv,.json,application/json,text/csv" />
          <div class="source-meta">
            <strong id="source-label">示例数据</strong>
            <span id="record-label">0 条记录</span>
            <span id="import-status">可导入 xlsx / csv / json</span>
          </div>
        </div>
      </header>

      <section class="section-block">
        <div class="section-heading">
          <div>
            <p class="section-kicker">Latest vs Last Week</p>
            <h2 id="weekly-title">最新日期对比上周同期</h2>
            <div class="analysis-scope" role="group" aria-label="新鲜货折扣范围">
              <span class="tag ok">新鲜货</span>
              <button type="button" class="scope-tab" data-discount-threshold="0.6" aria-pressed="false">低于6折</button>
              <button type="button" class="scope-tab" data-discount-threshold="0.8" aria-pressed="true">低于8折</button>
              <span class="scope-note">不含临界折扣；提示预警固定按低于6折判断</span>
            </div>
          </div>
          <div class="comparison-controls">
            <label><span>基准日期</span><select id="base-date"></select></label>
            <label><span>对比日期</span><select id="compare-date"></select></label>
            <button id="reset-comparison" type="button">重置</button>
          </div>
        </div>
        <div id="weekly-compare" class="compare-table-wrap"></div>
      </section>

      <section class="section-block">
        <div class="section-heading">
          <div>
            <p class="section-kicker">Fresh Stock Trend</p>
            <h2>不同品类新鲜货库存与折扣率趋势</h2>
            <div class="analysis-scope" role="group" aria-label="新鲜货折扣范围">
              <span class="tag ok">新鲜货</span>
              <button type="button" class="scope-tab" data-discount-threshold="0.6" aria-pressed="false">低于6折</button>
              <button type="button" class="scope-tab" data-discount-threshold="0.8" aria-pressed="true">低于8折</button>
              <span class="scope-note">不含临界折扣；提示预警固定按低于6折判断</span>
            </div>
          </div>
        </div>
        <div id="fresh-trend-grid" class="trend-grid"></div>
      </section>

      <section class="section-block">
        <div class="section-heading">
          <div>
            <p class="section-kicker">Near Expiry Watch</p>
            <h2>临期货关注</h2>
          </div>
        </div>
        <div id="near-expiry-watch" class="watch-grid"></div>
      </section>
    </main>

    <script src="./data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
